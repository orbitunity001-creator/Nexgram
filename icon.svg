<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B5CFF"/>
      <stop offset="50%" stop-color="#246BFF"/>
      <stop offset="100%" stop-color="#071A3D"/>
    </linearGradient>

    <linearGradient id="n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDE9FF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded app background -->
  <rect x="16" y="16" width="480" height="480" rx="120"
        fill="url(#bg)"/>

  <!-- Decorative glow -->
  <circle cx="390" cy="105" r="90"
          fill="#6FA0FF" opacity="0.18"/>
  <circle cx="105" cy="420" r="120"
          fill="#001B55" opacity="0.25"/>

  <!-- N -->
  <path d="
    M145 365
    V147
    C145 132 154 122 169 122
    H195
    C208 122 218 128 226 140
    L316 278
    V147
    C316 132 325 122 340 122
    H367
    V365
    H334
    C321 365 311 359 303 347
    L196 207
    V365
    Z"
    fill="url(#n)"
    filter="url(#glow)"/>

  <!-- Small accent -->
  <circle cx="390" cy="390" r="13"
          fill="#FFFFFF" opacity="0.85"/>
</svg>