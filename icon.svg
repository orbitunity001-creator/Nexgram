<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

    <!-- ЧЁРНЫЙ ФОН -->
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
        <stop offset="0%" stop-color="#102542"/>
        <stop offset="35%" stop-color="#071426"/>
        <stop offset="70%" stop-color="#020811"/>
        <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- СИНИЙ СВЕТ -->
    <radialGradient id="light">
        <stop offset="0%" stop-color="#43baff" stop-opacity=".9"/>
        <stop offset="35%" stop-color="#168cff" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#006cff" stop-opacity="0"/>
    </radialGradient>

    <!-- ТЕКСТ -->
    <linearGradient id="text"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="35%" stop-color="#dff4ff"/>
        <stop offset="65%" stop-color="#72c8ff"/>
        <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- ЗВЕЗДА -->
    <linearGradient id="star"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="40%" stop-color="#9cddff"/>
        <stop offset="75%" stop-color="#168cff"/>
        <stop offset="100%" stop-color="#005ec4"/>
    </linearGradient>

    <!-- СВЕЧЕНИЕ -->
    <filter id="blur"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
        <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="smallBlur"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
        <feGaussianBlur stdDeviation="5"/>
    </filter>

</defs>


<!-- ЧЁРНЫЙ ФОН -->

<rect
    width="512"
    height="512"
    rx="100"
    fill="url(#bg)"
/>


<!-- ========================== -->
<!-- БОЛЬШИЕ СВЕЧЕНИЯ -->
<!-- ========================== -->

<circle
    cx="55"
    cy="55"
    r="150"
    fill="url(#light)"
    filter="url(#blur)"
    opacity=".65"
/>

<circle
    cx="460"
    cy="80"
    r="130"
    fill="url(#light)"
    filter="url(#blur)"
    opacity=".45"
/>

<circle
    cx="80"
    cy="430"
    r="150"
    fill="url(#light)"
    filter="url(#blur)"
    opacity=".35"
/>

<circle
    cx="455"
    cy="440"
    r="160"
    fill="url(#light)"
    filter="url(#blur)"
    opacity=".55"
/>


<!-- ========================== -->
<!-- СВЕТ В ЦЕНТРЕ -->
<!-- ========================== -->

<ellipse
    cx="256"
    cy="255"
    rx="220"
    ry="145"
    fill="url(#light)"
    opacity=".12"
    filter="url(#blur)"
/>


<!-- ========================== -->
<!-- ДИАГОНАЛЬНЫЕ БЛИКИ -->
<!-- ========================== -->

<path
    d="M-30 360 L210 120"
    stroke="#36aaff"
    stroke-width="5"
    opacity=".15"
    filter="url(#smallBlur)"
/>

<path
    d="M300 530 L540 290"
    stroke="#39b7ff"
    stroke-width="6"
    opacity=".18"
    filter="url(#smallBlur)"
/>

<path
    d="M390 -20 L520 110"
    stroke="#63caff"
    stroke-width="5"
    opacity=".15"
    filter="url(#smallBlur)"
/>


<!-- ========================== -->
<!-- NEXGRAM — СВЕЧЕНИЕ -->
<!-- ========================== -->

<text
    x="256"
    y="267"

    text-anchor="middle"
    dominant-baseline="middle"

    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="800"
    letter-spacing="-2"

    fill="#159cff"
    opacity=".65"

    filter="url(#smallBlur)"
>
    Nexgram
</text>


<!-- NEXGRAM — ОСНОВНОЙ -->

<text
    x="256"
    y="267"

    text-anchor="middle"
    dominant-baseline="middle"

    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="800"
    letter-spacing="-2"

    fill="url(#text)"
>
    Nexgram
</text>


<!-- ========================== -->
<!-- ЗВЕЗДА -->
<!-- ========================== -->

<!-- свечение -->

<path
    d="
        M256 308
        L266 330
        L290 333
        L272 348
        L278 372
        L256 359
        L234 372
        L240 348
        L222 333
        L246 330
        Z
    "

    fill="#159cff"
    opacity=".85"

    filter="url(#blur)"
/>


<!-- сама звезда -->

<path
    d="
        M256 308
        L266 330
        L290 333
        L272 348
        L278 372
        L256 359
        L234 372
        L240 348
        L222 333
        L246 330
        Z
    "

    fill="url(#star)"
/>


