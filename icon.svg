<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">

  <defs>
    <!-- Белое стекло -->
    <linearGradient id="glass"
      x1="80" y1="40"
      x2="430" y2="470"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E8EDF3"/>
    </linearGradient>

    <!-- Тень -->
    <filter id="shadow"
      x="-40%"
      y="-40%"
      width="180%"
      height="180%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity=".18"/>
    </filter>

    <!-- Блик -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Белая основа -->
  <rect
    x="18"
    y="18"
    width="476"
    height="476"
    rx="125"
    fill="#FFFFFF"/>

  <!-- Стеклянная поверхность -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="110"
    fill="url(#glass)"/>

  <!-- Свет сверху -->
  <ellipse
    cx="160"
    cy="95"
    rx="145"
    ry="65"
    fill="#FFFFFF"
    opacity=".8"
    filter="url(#blur)"/>

  <!-- ЧЁРНЫЙ ^_^ ПО ЦЕНТРУ -->
  <g
    fill="none"
    stroke="#050505"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)">

    <!-- Левая "крышечка" -->
    <path d="M155 205 L185 175"/>

    <!-- Правая "крышечка" -->
    <path d="M327 175 L357 205"/>

    <!-- Улыбка -->
    <path d="
      M155 275
      C180 330 220 355 256 355
      C292 355 332 330 357 275
    "/>

  </g>

  <!-- Стеклянная рамка -->
  <rect
    x="33"
    y="33"
    width="446"
    height="446"
    rx="109"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    opacity=".95"/>

</svg>