  <defs>

    <!-- Ночной фон -->
    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">
      <stop offset="0%" stop-color="#07100f"/>
      <stop offset="55%" stop-color="#10241e"/>
      <stop offset="100%" stop-color="#1b3026"/>
    </linearGradient>

    <!-- Свет от монитора -->
    <radialGradient id="screenGlow"
                    cx="50%"
                    cy="45%"
                    r="65%">
      <stop offset="0%" stop-color="#b8fff0" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#5de0bd" stop-opacity="0"/>
    </radialGradient>

    <!-- Экран -->
    <linearGradient id="screen"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#172e2a"/>
      <stop offset="100%" stop-color="#071514"/>
    </linearGradient>

    <!-- Кот -->
    <linearGradient id="cat"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#b4bd8b"/>
      <stop offset="55%" stop-color="#89966d"/>
      <stop offset="100%" stop-color="#59634c"/>
    </linearGradient>

  </defs>


