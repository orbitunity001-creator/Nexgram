<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512">

    <defs>
        <radialGradient id="bg"
                        cx="50%"
                        cy="40%"
                        r="70%">
            <stop offset="0%"
                  stop-color="#173e70"/>
            <stop offset="100%"
                  stop-color="#020914"/>
        </radialGradient>

        <linearGradient id="fur"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
            <stop offset="0%"
                  stop-color="#f5f0e9"/>
            <stop offset="55%"
                  stop-color="#b9b4b0"/>
            <stop offset="100%"
                  stop-color="#6f7078"/>
        </linearGradient>

        <linearGradient id="gold"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
            <stop offset="0%"
                  stop-color="#fff0a0"/>
            <stop offset="45%"
                  stop-color="#ffbd32"/>
            <stop offset="100%"
                  stop-color="#b86b08"/>
        </linearGradient>
    </defs>

    <circle
        cx="256"
        cy="256"
        r="256"
        fill="url(#bg)"
    />

    <!-- ears -->
    <path
        d="M116 225
           L104 105
           L205 173
           Z"
        fill="url(#fur)"
    />

    <path
        d="M396 225
           L408 105
           L307 173
           Z"
        fill="url(#fur)"
    />

    <!-- head -->
    <ellipse
        cx="256"
        cy="270"
        rx="150"
        ry="145"
        fill="url(#fur)"
    />

    <!-- eyes -->
    <ellipse
        cx="195"
        cy="268"
        rx="35"
        ry="43"
        fill="#22aaff"
    />

    <ellipse
        cx="317"
        cy="268"
        rx="35"
        ry="43"
        fill="#22aaff"
    />

    <ellipse
        cx="195"
        cy="270"
        rx="11"
        ry="28"
        fill="#06101e"
    />

    <ellipse
        cx="317"
        cy="270"
        rx="11"
        ry="28"
        fill="#06101e"
    />

    <!-- nose -->
    <path
        d="M239 325
           Q256 313 273 325
           Q256 344 239 325"
        fill="#e9a9a9"
    />

    <!-- mouth -->
    <path
        d="M256 340
           Q256 356 239 362
           M256 340
           Q256 356 273 362"
        fill="none"
        stroke="#5d4a4a"
        stroke-width="6"
        stroke-linecap="round"
    />

    <!-- crown -->
    <path
        d="M160 120
           L178 48
           L222 91
           L256 35
           L290 91
           L334 48
           L352 120
           Z"
        fill="url(#gold)"
        stroke="#ffd86a"
        stroke-width="7"
        stroke-linejoin="round"
    />

    <circle
        cx="178"
        cy="48"
        r="9"
        fill="#fff2a8"
    />

    <circle
        cx="256"
        cy="35"
        r="9"
        fill="#fff2a8"
    />

    <circle
        cx="334"
        cy="48"
        r="9"
        fill="#fff2a8"
    />

</svg>