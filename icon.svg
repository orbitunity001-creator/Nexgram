<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

  <defs>
    <linearGradient id="bg"
      x1="40" y1="40" x2="470" y2="470">
      <stop offset="0" stop-color="#1677FF"/>
      <stop offset="0.55" stop-color="#1746E8"/>
      <stop offset="1" stop-color="#651BFF"/>
    </linearGradient>

    <linearGradient id="n"
      x1="150" y1="120" x2="360" y2="390">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E9F2FF"/>
      <stop offset="1" stop-color="#BBD6FF"/>
    </linearGradient>

    <linearGradient id="glow"
      x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65E7FF"/>
      <stop offset="1" stop-color="#A66CFF"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="14"
        flood-opacity="0.28"/>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Иконка -->
  <rect x="18" y="18"
        width="476" height="476"
        rx="120"
        fill="url(#bg)"/>

  <!-- Мягкое свечение -->
  <circle cx="95" cy="90" r="100"
          fill="#58D9FF"
          opacity="0.22"
          filter="url(#soft)"/>

  <circle cx="425" cy="425" r="120"
          fill="#9B4DFF"
          opacity="0.22"
          filter="url(#soft)"/>

  <!-- Орбитальная линия NEX -->
  <path d="
    M92 315
    C115 395 205 430 310 399
    C390 376 438 320 426 253"
    fill="none"
    stroke="url(#glow)"
    stroke-width="13"
    stroke-linecap="round"
    opacity="0.95"/>

  <!-- Главная буква N -->
  <path d="
    M135 365
    L135 147
    C135 130 145 120 161 120
    L184 120
    C198 120 207 126 216 139
    L315 282
    L315 147
    C315 130 325 120 341 120
    L377 120
    L377 365
    L343 365
    C329 365 319 358 310 345
    L197 205
    L197 365
    Z"
    fill="url(#n)"
    filter="url(#shadow)"/>

  <!-- Разрез внутри N — фирменная деталь -->
  <path d="
    M205 238
    L238 278
    L238 365
    L205 365
    Z"
    fill="#1746E8"
    opacity="0.9"/>

  <!-- Маленькая светящаяся точка -->
  <circle cx="404" cy="116"
          r="9"
          fill="#FFFFFF"/>

  <circle cx="404" cy="116"
          r="19"
          fill="#65E7FF"
          opacity="0.25"
          filter="url(#soft)"/>

</svg>