<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">

  <defs>
    <!-- Белое стекло -->
    <linearGradient id="glass"
      x1="80" y1="40"
      x2="430" y2="470"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E8EDF3"/>
    </linearGradient>

    <!-- Тень -->
    <filter id="shadow"
      x="-40%"
      y="-40%"
      width="180%"
      height="180%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity=".18"/>
    </filter>

    <!-- Блик -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Белая основа -->
  <rect
    x="18"
    y="18"
    width="476"
    height="476"
    rx="125"
    fill="#FFFFFF"/>

  <!-- Стеклянная поверхность -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="110"
    fill="url(#glass)"/>

  <!-- Свет сверху -->
  <ellipse
    cx="160"
    cy="95"
    rx="145"
    ry="65"
    fill="#FFFFFF"
    opacity=".8"
    filter="url(#blur)"/>

  <!-- ^_^ НЕ МЕНЯЕМ -->
  <!-- Только увеличен размер -->
  <g
    fill="none"
    stroke="#050505"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)">

    <!-- ^ -->
    <path d="M105 210 L155 155"/>
    <path d="M155 155 L205 210"/>

    <!-- _ -->
    <path d="
      M105 285
      C145 355 195 385 256 385
      C317 385 367 355 407 285
    "/>

    <!-- ^ -->
    <path d="M307 210 L357 155"/>
    <path d="M357 155 L407 210"/>

  </g>

  <!-- Рамка -->
  <rect
    x="33"
    y="33"
    width="446"
    height="446"
    rx="109"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    opacity=".95"/>

</svg>