<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#071426">

    <link rel="manifest" href="./manifest.json">

    <link rel="icon" href="./cat.jpg">

    <title>Nexgram</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <button id="installButton">
        Установить
    </button>

    <main>

        <div class="avatar">
            <img
                src="./cat.jpg"
                alt="Nexgram"
                onerror="this.parentElement.classList.add('image-error')"
            >
        </div>

        <h1>Nexgram</h1>

    </main>

    <div id="installMessage" class="install-message">
        Чтобы установить Nexgram, нажми меню Chrome ⋮
        и выбери «Установить приложение».
        <button id="closeMessage">Закрыть</button>
    </div>

    <script src="./app.js"></script>

</body>
</html>
