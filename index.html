<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Робот</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="robot-app">

    <section class="robot-card">

      <div class="robot-header">
        <div>
          <h1>ROBO</h1>
          <p id="status">Готов к разговору</p>
        </div>

        <div class="online">
          <span></span>
          ONLINE
        </div>
      </div>

      <div class="robot-screen">

        <div id="robotFace" class="face happy">

          <div class="eyes">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
          </div>

          <div id="mouth" class="mouth"></div>

        </div>

        <div id="speech" class="speech">
          Привет! Я готов разговаривать.
        </div>

      </div>

      <div class="controls">
        <button id="talkButton">
          🎤 Говорить
        </button>

        <button id="stopButton">
          🔇 Стоп
        </button>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
