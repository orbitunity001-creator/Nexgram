<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NEX</title>

    <link rel="stylesheet" href="./style.css?v=10">
    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#ffffff">
</head>

<body>

    <div class="aurora">
        <div class="aurora-ball ball-1"></div>
        <div class="aurora-ball ball-2"></div>
        <div class="aurora-ball ball-3"></div>
    </div>

    <div class="noise"></div>

    <!-- Шапка -->

    <header class="topbar">
        <div class="brand">NEX</div>

        <button id="installBtn"
                class="install-btn"
                hidden>
            Установить
        </button>
    </header>


    <!-- ========================= -->
    <!-- АВТОРИЗАЦИЯ -->
    <!-- ========================= -->

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <div class="mini-logo">NEX</div>

                <h1 id="authTitle">
                    Добро пожаловать
                </h1>

                <p id="authSubtitle">
                    Войдите в свой NEX аккаунт
                </p>

            </div>


            <!-- ========================= -->
            <!-- ВХОД -->
            <!-- ========================= -->

            <form id="loginForm"
                  class="auth-form">

                <label>
                    NEX ID

                    <input
                        id="loginId"
                        type="text"
                        placeholder="NEX-000001"
                        autocomplete="username"
                        required>
                </label>


                <label>
                    Пароль

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Введите пароль"
                        autocomplete="current-password"
                        required>
                </label>


                <button type="submit"
                        class="main-btn">
                    Войти
                </button>


                <button type="button"
                        id="openRegister"
                        class="secondary-btn">
                    Создать аккаунт
                </button>


                <button type="button"
                        id="anonymousBtn"
                        class="anonymous-btn">
                    Продолжить как Аноним
                </button>

            </form>


            <!-- ========================= -->
            <!-- РЕГИСТРАЦИЯ -->
            <!-- ========================= -->

            <form id="registerForm"
                  class="auth-form hidden">

                <label>
                    Ник
                    <span class="optional">
                        необязательно
                    </span>

                    <input
                        id="registerNickname"
                        type="text"
                        maxlength="32"
                        placeholder="Например, Alex">
                </label>


                <label>
                    Пароль

                    <input
                        id="registerPassword"
                        type="password"
                        minlength="6"
                        maxlength="128"
                        placeholder="Придумайте пароль"
                        autocomplete="new-password"
                        required>
                </label>


                <label>
                    Повторите пароль

                    <input
                        id="registerPassword2"
                        type="password"
                        minlength="6"
                        maxlength="128"
                        placeholder="Введите пароль ещё раз"
                        autocomplete="new-password"
                        required>
                </label>


                <button type="submit"
                        class="main-btn">
                    Зарегистрироваться
                </button>


                <button type="button"
                        id="openLogin"
                        class="secondary-btn">
                    Уже есть аккаунт
                </button>

            </form>


            <!-- Ошибка -->

            <div id="authMessage"
                 class="auth-message">
            </div>

        </section>

    </main>


    <!-- ========================= -->
    <!-- ЧАТЫ ЕЩЁ НЕ ГОТОВЫ -->
    <!-- ========================= -->

    <section id="notReadyScreen"
             class="screen hidden">

        <div class="not-ready-card">

            <div class="not-ready-icon">
                💬
            </div>

            <h2>
                Чаты ещё не готовы
            </h2>

            <p>
                Мы уже работаем над чатами NEX.
                Скоро здесь появится полноценный
                школьный мессенджер.
            </p>

            <div id="accountInfo"
                 class="account-info">
            </div>

            <button id="logoutBtn"
                    class="main-btn">
                Выйти
            </button>

        </div>

    </section>


    <script src="./app.js?v=10"></script>

</body>
</html>
