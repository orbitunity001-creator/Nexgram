<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#080b10">

  <title>ROBO — Robot Interface</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Верхняя панель -->
    <header class="topbar">

      <div class="brand">
        <div class="brand-mark">
          R
        </div>

        <div class="brand-text">
          <strong>ROBO</strong>
          <span>PERSONAL ROBOT</span>
        </div>
      </div>


      <div class="system-status">
        <span class="status-dot"></span>
        <span>READY</span>
      </div>

    </header>


    <!-- Основной экран -->
    <main class="main">

      <section class="robot-area">

        <div class="face-container">

          <div
            id="face"
            class="face"
            aria-label="Лицо робота"
          >
            ^_^
          </div>

        </div>


        <div class="robot-info">

          <div class="robot-name">
            ROBO
          </div>

          <div
            id="robotStatus"
            class="robot-status"
          >
            Готов к запуску
          </div>

        </div>

      </section>


      <!-- Нижняя панель -->
      <section class="control-panel">

        <div class="panel-line"></div>

        <button
          id="startButton"
          class="start-button"
          type="button"
        >

          <span class="button-icon">
            ▶
          </span>

          <span class="button-text">
            НАЧАТЬ
          </span>

        </button>

        <div class="hint">
          Нажмите, чтобы запустить робота
        </div>

      </section>

    </main>


    <!-- Нижняя информация -->
    <footer class="footer">

      <span>ROBO SYSTEM</span>

      <span class="separator">•</span>

      <span>v1.0</span>

      <span class="separator">•</span>

      <span>LOCAL</span>

    </footer>

  </div>


  <script src="script.js"></script>

</body>
</html>
